name: Build debug APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Memoria para Gradle y Kotlin
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> ~/.gradle/gradle.properties
      - run: chmod +x gradlew && ./gradlew assembleStandardDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mpvex-apk
          path: app/build/outputs/apk/**/*.apk
